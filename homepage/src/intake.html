<meta charset="utf-8">
<title>Get started · GoodRx</title>
<script>document.documentElement.classList.add('dark')</script>
<style>
/* Intake: mobile designs (393 frames) in a centered column; desktop just widens the page around it. */
@font-face{font-family:"Bolton";src:url(fonts/GoodRxBolton-Light.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Bolton";src:url(fonts/GoodRxBolton-LightItalic.woff2) format("woff2");font-weight:300;font-style:italic;font-display:swap}
@font-face{font-family:"Bolton";src:url(fonts/GoodRxBolton-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Bolton";src:url(fonts/GoodRxBolton-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Moon";src:url(fonts/GoodRxMoon-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  --n0:#fffffb;--n100:#f5efe5;--n200:#efe7dd;--n300:#d7d1c6;--n400:#bfb6ae;--n900:#1a1916;
  --y100:#fff6bf;--y200:#ffef8a;--y400:#fddb00;
  --g100:#ebeabd;--g200:#dedb7c;--g600:#436f58;--g700:#1c534e;--g800:#184844;
  --dark:rgba(18,17,15,.9);--soft:rgba(18,17,15,.6);--k40:rgba(18,17,15,.4);--k20:rgba(18,17,15,.2);--k10:rgba(18,17,15,.1);
  --rev:rgba(255,255,251,.9);--rev-soft:rgba(255,255,251,.7);
  --sans:"Bolton",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --num:"Moon","Bolton",ui-sans-serif,system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);--spring:cubic-bezier(.34,1.4,.5,1);
  --col:520px;
  --bg:var(--n100);
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:clip}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--dark);font:400 16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
a,button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--g700);outline-offset:3px;border-radius:6px}
.dark :focus-visible{outline-color:var(--y100)}
html.dark{--bg:var(--g800)}

/* page texture for dark screens */
.tex{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .6s var(--ease);overflow:hidden}
.tex img{position:absolute;left:50%;top:10%;width:max(834px,120vw);max-width:none;transform:translateX(-45%);filter:blur(50px);mix-blend-mode:overlay;opacity:.5}
html.dark .tex{opacity:1}
/* overlay needs the green inside the same layer to blend against (Figma 3023:171142) */
.tex{background:var(--g800)}

/* ---------- header ---------- */
.ih{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
/* frosted header: content scrolling underneath blurs out and fades into the page colour */
.ih::before{content:"";position:absolute;inset:0 0 -16px;z-index:-1;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--bg) 88%,transparent),color-mix(in srgb,var(--bg) 70%,transparent));
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  -webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent);
  transition:background-color .5s var(--ease)}
.ih-in{position:relative}
/* solid strip under the status bar: iOS Safari tints the status bar from a solid element pinned to the top, so it follows each screen's colour */
.sbar,.bbar{position:fixed;z-index:21;left:0;right:0;background-color:var(--bg);pointer-events:none}
.sbar{top:0;height:max(env(safe-area-inset-top,0px),6px)}
/* solid header on every screen: iOS Safari tints the status bar from it, and keeps a stale colour if it ever goes see-through */
.ih{background-color:var(--bg)}
html.herotop .ih{background-color:transparent}
html.herotop .ih::before{background:none}
html.herotop .sbar{background-color:transparent}
.bbar{bottom:0;height:env(safe-area-inset-bottom,0px)}
html.blank .sbar,html.blank .bbar{background-color:var(--n0)}
/* the light texture fades out at the edges so the page meets Safari's bars in a flat colour */
.tex{-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
/* breaker screens fit the viewport and don't scroll */
html.fit,html.fit body{height:100%;overflow:hidden;overscroll-behavior:none}
html.fit .scr{height:calc(100dvh - var(--hh,74px) - env(safe-area-inset-top,0px));min-height:0;overflow:visible clip}
.prog{max-width:var(--col);margin:0 auto}
[tabindex="-1"]:focus{outline:none}
.ih-row{position:relative;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.ih-btn{width:36px;height:36px;margin:0 -8px;display:grid;place-items:center;border-radius:8px;color:var(--dark);transition:background-color .2s,opacity .25s}
.ih-btn svg{width:20px;height:20px}
@media (hover:hover){.ih-btn:hover{background:var(--k10)}}
html.dark .ih-btn{color:var(--n0)}
.ih-btn[hidden]{display:grid;visibility:hidden}
.ih-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ih-logo{width:24px;height:24px}
.prog{display:flex;gap:8px;padding:12px 20px;height:26px;align-items:center}
.prog button{flex:1;padding:10px 0;margin:-10px 0;cursor:pointer;border-radius:4px}
.prog i{display:block;height:2px;border-radius:9px;background:rgba(128,128,128,.3);overflow:hidden;position:relative;transition:transform .2s var(--ease)}
@media (hover:hover){.prog button:hover i{transform:scaleY(2)}}
.prog b{position:absolute;inset:0 auto 0 0;width:0;background:var(--g700);border-radius:9px;transition:width .6s var(--ease)}
html.dark .prog b{background:var(--y400)}
.ih.noprog .prog{visibility:hidden}

/* ---------- screen + transitions ---------- */
.stage{position:relative;z-index:1;max-width:var(--col);margin:0 auto}
.scr{min-height:calc(100dvh - var(--hh,74px) - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:8px 0 0}
.scr.enter{animation:scrIn .5s var(--ease) both}
.scr.enter.back{animation-name:scrBack}
@keyframes scrIn{from{opacity:0;transform:translate3d(24px,0,0)}to{opacity:1;transform:none}}
@keyframes scrBack{from{opacity:0;transform:translate3d(-24px,0,0)}to{opacity:1;transform:none}}
.body{flex:1;padding:0 20px 24px}
.ttl{padding:8px 20px 20px 0;display:flex;flex-direction:column;gap:10px}
.ttl h1{margin:0;font-weight:400;font-size:28px;line-height:1.2;letter-spacing:-.01em;color:#111112}
.ttl p{margin:0;font-size:14px;color:var(--soft)}
.ttl p.lg{font-size:16px}
.foot{position:sticky;bottom:0;z-index:5;padding:20px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(245,239,229,0),var(--n100) 45%);display:flex;flex-direction:column;gap:16px;align-items:center}
html.dark .foot{background:none}
.foot .alt{font-size:14px;color:var(--soft)}
html.dark .foot .alt{color:var(--rev-soft)}
.foot .alt b{font-weight:500;color:var(--g700);margin-left:4px;letter-spacing:.01em}
html.dark .foot .alt b{color:var(--y100)}

/* ---------- buttons ---------- */
.btn{width:100%;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20px;font-weight:500;font-size:14px;letter-spacing:.01em;line-height:1;transition:background-color .25s,opacity .25s,transform .2s var(--ease)}
.btn:active{transform:scale(.985)}
.btn-g{background:var(--g700);color:var(--y100)}
@media (hover:hover){.btn-g:hover{background:var(--g800)}}
.btn-y{background:var(--y100);color:var(--g800)}
@media (hover:hover){.btn-y:hover{background:#fff1a0}}
.btn-o{border:1px solid var(--g700);color:var(--g700)}
@media (hover:hover){.btn-o:hover{background:rgba(28,83,78,.06)}}
.btn[disabled]{pointer-events:none}
.btn:not(.btn-g)[disabled]{opacity:.35}
/* UI Kit inactive primary (23:2632): solid green-800, text white-30 -- never see-through */
.btn-g[disabled]{background:var(--g800);color:rgba(255,255,251,.3)}
.link{font-weight:500;font-size:14px;color:var(--g700);letter-spacing:.01em}

/* ---------- option rows (single + multi) ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:16px;border-radius:16px;background:var(--n200);border:.5px solid var(--n300);color:var(--soft);font-size:16px;line-height:1.4;transition:background-color .2s,border-color .2s,color .2s}
.opt[role="radio"]{color:var(--dark)}
.opts.has-sel .opt[role="radio"][aria-checked="false"]{color:var(--soft)}
.opt:has(small){padding-top:20px;padding-bottom:20px}
.multi .opt{color:var(--dark)}
.opt .ol{flex:1;min-width:0}
.opt .ol small{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.opt .ic{flex:none;width:20px;height:20px;border:1px solid var(--k20);border-radius:999px;display:grid;place-items:center;margin-top:1px;transition:border-color .2s,background-color .2s}
.multi .opt .ic{border-radius:4px}
.opt .ic::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--g700);transform:scale(0);transition:transform .3s var(--spring)}
.multi .opt .ic::after{display:none}
.multi .opt .ic svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--spring)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{background:rgba(255,255,251,.4);border:1px solid var(--g700);padding:15.5px;color:var(--g700)}
.opt:has(small)[aria-checked="true"],.opt:has(small)[aria-pressed="true"]{padding-top:19.5px;padding-bottom:19.5px}
.opt[aria-checked="true"] .ic{border-color:var(--g700)}
.opt[aria-checked="true"] .ic::after{transform:scale(1)}
.multi .opt[aria-pressed="true"] .ic{background:var(--g700);border-color:var(--g700)}
.multi .opt[aria-pressed="true"] .ic svg{opacity:1;transform:none}
@media (hover:hover){.opt:not([aria-checked="true"]):not([aria-pressed="true"]):hover{background:#ebe2d6}}

/* ---------- inputs ---------- */
.fields{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;gap:8px}
.frow>*{flex:1;min-width:0}
.fld{position:relative;display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;border-radius:8px;background:var(--n0);border:1px solid var(--n300);transition:border-color .2s}
.fld:focus-within{border-color:var(--g700)}
.fld .fd{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;height:100%}
.fld label{font-size:16px;color:var(--soft);line-height:18px;transition:font-size .2s var(--ease)}
.fld input,.fld select{width:100%;border:0;background:none;outline:0;padding:0;font-size:16px;line-height:1.4;color:var(--dark);height:0;opacity:0;transition:opacity .2s}
.fld.on label{font-size:12px}
.fld.on input,.fld.on select{height:22px;opacity:1}
.fld .unit{color:var(--soft);font-size:16px}
.ddw{position:relative}
.fld.dd{cursor:pointer;outline:none}
.fld.dd .chev{transition:transform .3s var(--ease)}
.ddw.open .fld.dd,.fld.dd:focus-visible{border-color:var(--g700)}
.ddw.open .fld.dd .chev{transform:rotate(180deg)}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:6;list-style:none;margin:0;padding:16px;border-radius:8px;background:var(--n0);box-shadow:0 8px 20px rgba(0,0,0,.06),0 0 0 .5px var(--n300);display:flex;flex-direction:column;gap:16px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .2s var(--ease),transform .25s var(--ease),visibility 0s .25s}
.ddw.open .dd-list{opacity:1;visibility:visible;transform:none;transition:opacity .2s var(--ease),transform .25s var(--ease),visibility 0s}
.dd-list li{font-size:16px;line-height:1.4;color:var(--soft);cursor:pointer;outline:none;border-radius:4px;transition:color .15s}
.dd-list li:hover,.dd-list li:focus-visible,.dd-list li[aria-selected="true"]{color:var(--g700)}
.fld .sv{display:none;font-size:16px;line-height:1.4;color:var(--dark)}
.fld.on .sv{display:block}
.fld .chev{width:20px;height:20px;color:var(--soft);flex:none}
.fld.err{border-color:#b3402a}
.fhelp{font-size:13px;line-height:1.4;color:var(--soft);padding-left:16px}
.li-rows{display:flex;flex-direction:column;gap:16px}
.li-row{display:grid;grid-template-columns:1fr 20px;column-gap:13px;align-items:start}
.li-row .fhelp{grid-column:1;margin:8px 0 0}
.li-x{width:20px;height:20px;margin-top:18px;padding:0;border-radius:50%;display:grid;place-items:center}
.li-add{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:32px;padding:8px 0;font-weight:500;font-size:14px;letter-spacing:.01em;color:var(--g700)}
.body.li{display:flex;flex-direction:column}

/* ---------- dark screens: overview + step intro ---------- */
.dk{color:var(--rev-soft)}
.dk h1{margin:0;font-weight:300;font-size:40px;line-height:1.2;letter-spacing:-.01em;color:var(--y100)}
.dk .lead{margin:10px 0 0;font-size:16px}
.ov-steps{list-style:none;margin:32px 0 0;padding:0;display:flex;flex-direction:column;gap:20px}
.ov-steps li{display:flex;align-items:center;gap:16px}
.numbox{flex:none;width:48px;height:48px;border-radius:4.75px;border:.5px solid var(--g600);display:grid;place-items:center;font:400 24px/1 var(--num);color:var(--rev-soft)}
.cap{font-size:10px;line-height:1;letter-spacing:.1em;text-transform:uppercase}
.ov-steps .t{display:flex;flex-direction:column;gap:8px}
.ov-steps .t span:last-child{font-size:16px;line-height:1.2}
.si{padding-top:56px;display:flex;flex-direction:column;gap:32px;max-width:337px}
.si .numbox{width:68px;height:68px;background:var(--g700);border-width:.3px;color:var(--y100);font-size:32px}
.si .tx{display:flex;flex-direction:column;gap:12px}
.si p{margin:0;font-size:16px;line-height:1.4}
.si-line{position:relative;height:300px;margin:-24px -20px 0;pointer-events:none;overflow:visible}
.si-line img{position:absolute;left:50%;top:0;width:130px;height:507px;max-width:none;transform:translate(-50%,-30%) rotate(67.5deg) scaleY(-1)}
.si-line img{clip-path:inset(0 0 100% 0);animation:lineIn 1.6s var(--ease) .25s forwards}
@keyframes lineIn{to{clip-path:inset(0 0 0 0)}}

/* ---------- bottom sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(18,17,15,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .35s var(--ease)}
.sheet-wrap{position:fixed;inset:auto 0 0;z-index:41;display:flex;justify-content:center;pointer-events:none}
.sheet{pointer-events:auto;width:100%;max-width:var(--col);max-height:calc(100dvh - 40px);overflow:auto;background:linear-gradient(var(--n0),var(--n100));border-radius:24px 24px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translate3d(0,100%,0);transition:transform .5s cubic-bezier(.16,1,.3,1);box-shadow:0 -8px 40px rgba(18,17,15,.12)}
.sheet .grab{width:84px;height:4px;border-radius:9px;background:var(--n300);margin:0 auto 24px}
.sheet h2{margin:0;font-weight:400;font-size:28px;line-height:1.2;letter-spacing:-.01em;color:#111112}
.sheet .sub{margin:8px 0 24px;color:var(--soft);font-size:16px}
.sheet .stack{display:flex;flex-direction:column;gap:16px}
.or{display:flex;align-items:center;gap:16px;color:var(--soft);font-size:12px;letter-spacing:.1em;padding:0 24px}
.or::before,.or::after{content:"";flex:1;height:.5px;background:var(--n400)}
.sheet .loc-s{gap:32px}
.loc-cur{display:flex;flex-direction:column;align-items:center;gap:12px}
.loc-cur .btn{width:100%;gap:12px}
.loc-cur .btn svg{width:16px;height:16px}
.loc-cur p{margin:0;font-size:14px;color:var(--soft)}
.loc-act{display:flex;gap:16px;margin-top:-16px}
.loc-act .btn{flex:1}
.sv-exit{display:block;margin:24px auto 0;padding:12px 0;font-weight:500;font-size:14px;color:var(--g700)}
.sheet .alt{text-align:center;font-size:14px;color:var(--dark);margin-top:24px}
.sheet .alt b{font-weight:500;color:var(--g700);margin-left:8px}
.open .sheet-bg{opacity:1}
.open .sheet{transform:none}
.sheet-x{display:none}
/* desktop: bottom sheets become centred modals */
@media (min-width:768px){
  .sheet-wrap{inset:0;align-items:center;padding:24px}
  .sheet{position:relative;width:min(520px,100%);max-height:min(85vh,760px);border-radius:24px;padding:40px 32px 32px;transform:translate3d(0,16px,0) scale(.97);opacity:0;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .3s var(--ease);box-shadow:0 24px 80px rgba(18,17,15,.22)}
  .open .sheet{transform:none;opacity:1}
  .sheet .grab{display:none}
  .sheet-x{display:grid;place-items:center;position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:8px;color:var(--dark);z-index:2}
  .sheet-x svg{width:20px;height:20px}
  @media (hover:hover){.sheet-x:hover{background:var(--k10)}}
  .sheet.tall{height:auto;max-height:min(85vh,760px);padding-bottom:0}
  .sh-foot{margin:auto -32px 0;padding:16px 32px 24px}
}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--n900);color:var(--n0);font-size:13px;padding:10px 14px;border-radius:10px;transition:opacity .25s,transform .35s var(--ease);max-width:calc(100vw - 40px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* desktop: a touch more air above the column */
@media (min-width:768px){
  :root{--hh:78px}
  .ih-row{height:60px;padding:0 32px}
  .prog{max-width:none;height:auto;padding:2px 32px 14px}
  .ih-btn{width:40px;height:40px;margin:0 -8px}
  .ih-btn svg{width:24px;height:24px}
  .ih.intro .ih-mid{left:32px;transform:translateY(-50%)}
  .ih.intro.hasback .ih-mid{left:76px}
  .scr{padding-top:64px;min-height:calc(100dvh - var(--hh))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.ih.hide .ih-row{visibility:hidden}
html.blank{--bg:var(--n0)}
html.blank body{background:linear-gradient(var(--n0),var(--n100)) fixed}

/* good news */
.gn{display:flex;flex-direction:column;align-items:center;text-align:center}
.gn-tx{max-width:309px;padding-top:32px}
.gn h1{margin:0;font-weight:400;font-size:32px;line-height:1.2;letter-spacing:-.01em;color:var(--g700)}
.gn-tx p{margin:12px 0 0;color:var(--dark)}
.gn-hero{position:relative;width:200px;height:200px;margin:56px auto 64px;animation:pop 1s var(--spring) .15s both}
.gn-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gn-hero .sh{mix-blend-mode:multiply}
.gn-hero .pen{transform:none}
/* mobile: fits the viewport -- the image shrinks to whatever room is left (pill or pen, aspect kept)
   and the card sits just above the CTA */
@media (max-width:767px){
  /* mfit = fit the viewport on mobile only; desktop keeps its centred, scrollable layout */
  html.mfit,html.mfit body{height:100%;overflow:hidden;overscroll-behavior:none}
  html.mfit .scr{height:calc(100dvh - var(--hh,74px) - env(safe-area-inset-top,0px));min-height:0;overflow:visible clip}
  html.mfit .scr>.body{min-height:0}
  .gn-tx{padding-top:16px}
  /* image sits a fixed distance under the copy for every medication; the card is pushed down to just above the CTA */
  .gn-hero{flex:0 1 200px;height:auto;min-height:72px;margin:32px auto 16px}
  .gn-hero:has(.pen){flex-basis:240px}
  .gn-card{flex:none;margin-top:auto}
  .body.gn{padding-bottom:4px}
}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(12px)}to{opacity:1;transform:none}}
.gn-card{width:100%;text-align:left;background:var(--g100);border:1px solid #b7c073;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.gn-card b{font-weight:400;font-size:16px;line-height:1.2;color:var(--g700)}
.gn-card p{margin:0;font-size:14px;color:var(--soft)}

/* code input */
.code{display:flex;justify-content:center;gap:6px}
.code input{flex:1;min-width:0;max-width:56px;height:auto;aspect-ratio:54/56;padding:0;border-radius:8px;border:1px solid var(--n300);background:var(--n0);text-align:center;font:400 24px/1 var(--num);color:var(--dark);outline:0;transition:border-color .2s}
.code input:focus{border-color:var(--g700)}

/* legal checkboxes */
.chks{display:flex;flex-direction:column;gap:12px}
.chk{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border-radius:16px;background:var(--n0);border:1px solid var(--n300);font-size:16px;line-height:1.4;color:var(--dark);transition:border-color .2s}
.chk .ic{flex:none;width:20px;height:20px;border-radius:4px;border:1px solid var(--k20);display:grid;place-items:center;transition:background-color .2s,border-color .2s}
.chk .ic svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--spring)}
.chk[aria-pressed="true"]{border-color:var(--g700)}
.chk[aria-pressed="true"] .ic{background:var(--g700);border-color:var(--g700)}
.chk[aria-pressed="true"] .ic svg{opacity:1;transform:none}
.chk a{color:var(--g700);text-decoration:underline;text-underline-offset:2px}

/* membership plan card */
.pcard{background:var(--n0);border:1px solid var(--n200);border-radius:16px;padding:17px;display:flex;flex-direction:column;gap:20px;margin-top:8px}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.pc-top b{font-weight:400;font-size:20px;line-height:1.2;color:#111112;max-width:130px}
.pc-tile{flex:none;width:42px;height:42px;border-radius:8px;background:#5c2d44;display:grid;place-items:center}
.pc-tile img{width:20px;height:20px}
.pc-pr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--soft);padding-bottom:20px;border-bottom:1px solid var(--n200)}
.v{display:inline-flex;align-items:baseline;color:var(--dark)}
.num{font-family:var(--num);font-weight:400;line-height:1}
.pc-pr .num{font-size:20px}.pc-pr small{font-size:13px}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.perks li{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--soft)}
.pk{flex:none;width:40px;height:40px;border-radius:8px;background:var(--g100);border:.5px solid var(--g200);display:grid;place-items:center}
.pk img{width:20px;height:20px}
.fn{font-size:13px;color:var(--soft);margin:16px 17px 0}

/* results */
.dot-u{border-bottom:1px dashed var(--g700);cursor:help}
.rs{padding-left:0;padding-right:0;display:flex;flex-direction:column;min-height:0}
.rs .ttl{padding-left:20px;padding-right:40px}
.rs-graph{position:relative;flex:1 1 300px;min-height:220px;max-height:300px;margin-top:24px}
.rs-graph>img{position:absolute;left:-3px;top:0;width:calc(100% + 6px);height:459px;max-width:none;-webkit-mask-image:linear-gradient(#000 40%,transparent 66%);mask-image:linear-gradient(#000 40%,transparent 66%)}
.rs-stat{position:absolute;right:22px;top:28px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rs-stat .num{font-size:40px;color:var(--g700)}
.rs-stat span:last-child{font-size:13px;color:var(--soft)}
.rs-row{position:relative;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px;scrollbar-width:none;margin-top:-64px;flex:none}
.rs-row::-webkit-scrollbar{display:none}
.rs-track{display:flex;gap:8px}
.rs-row{overflow:hidden;scroll-snap-type:none;padding:0}
.rs-track{width:max-content;animation:rsDrift 36s linear infinite}
.rs-card{scroll-snap-align:none}
@media (min-width:768px){
  /* desktop: graph and photos run wider than the column and fade out at the edges; photos drift slowly */
  .rs-graph,.rs-row{-webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.25) 12%,#000 32%,#000 68%,rgba(0,0,0,.25) 88%,transparent);mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.25) 12%,#000 32%,#000 68%,rgba(0,0,0,.25) 88%,transparent)}
  .rs-graph{width:100vw;margin-left:calc(50% - 50vw);margin-top:40px}
  .rs-row{width:min(100vw,1000px);margin-left:calc(50% - min(50vw,500px))}
  .rs-stat{right:calc(50% - 240px)}
  .rs .rs-card{width:280px;height:200px}
}
@keyframes rsDrift{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 4px))}}
@media (prefers-reduced-motion:reduce){.rs-track{animation:none}}
.rs-card{position:relative;flex:none;width:252px;height:180px;border-radius:16px;overflow:hidden;scroll-snap-align:center;color:var(--y100);background:var(--n400)}
.rs-card .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rs-card::after{content:"";position:absolute;inset:0;background:linear-gradient(36deg,rgba(0,0,0,.5) .6%,rgba(0,0,0,0) 40.7%)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:4px;background:var(--y100);border:.5px solid var(--y200);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--g700);line-height:1}
.rs-card .chip{position:absolute;left:16px;top:16px;z-index:2}
.rs-b{position:absolute;left:0;bottom:0;z-index:2;padding:16px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.rs-b .v{color:var(--y100);font-size:13px}.rs-b .num{font-size:40px;margin-right:2px}

/* loaders */
.ld{display:flex;flex-direction:column;justify-content:space-between;min-height:calc(100dvh - 120px)}
@media (min-width:768px){.ld{justify-content:center;gap:56px}.ld-mid{padding-top:0}}
.ld-mid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:40px;padding-top:40px}
.ld-mid h1{margin:0;max-width:309px;font-weight:400;font-size:24px;line-height:1.2;color:var(--dark)}
.orb{width:180px;height:180px}
.orb .ob{transform-origin:90px 90px;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-list{list-style:none;margin:0;padding:20px;border-radius:16px;background:var(--n200);border:.5px solid var(--n300);display:flex;flex-direction:column;gap:16px}
.ld-list li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);opacity:.35;animation:ldOn .4s var(--ease) var(--d) forwards}
.ld-list svg{width:20px;height:20px}
.ld-list .tk{stroke-dasharray:12;stroke-dashoffset:12;animation:ckDraw .4s var(--ease) var(--d) forwards}
@keyframes ldOn{to{opacity:1}}
@keyframes ckDraw{to{stroke-dashoffset:0}}

/* ID + selfie */
.eyb{margin:0 0 8px;font-size:10px;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.id-steps{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:24px}
.id-steps li{display:flex;align-items:center;gap:16px}
.id-steps .t{display:flex;flex-direction:column;gap:8px;color:var(--soft)}
.id-steps .t span:last-child{font-size:16px;line-height:1.2;color:var(--g700)}
.numbox.lt{background:var(--g100);border:.3px solid #b7c073;color:var(--g700)}
.up{background:var(--n0);border:1px solid var(--n200);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.up-well{position:relative;height:201px;border-radius:12px;border:1px solid var(--n200);overflow:hidden;background:radial-gradient(130% 140% at 100% 100%,#fff3b0 0%,rgba(255,246,191,.75) 30%,rgba(255,246,191,.25) 62%,#fffffb 92%)}
.up-well .glow{display:none}
.up-well .sk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.6}
.up-well .sk.id{width:225px}.up-well .sk.sf{width:240px;top:46%}
.up-ph{width:100%;height:253px;object-fit:cover;border-radius:8px;animation:pop .6s var(--spring) both}
.up-ph.sq{height:283px}
.tips p{margin:0 0 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--g700)}
.tips ul{margin:0;padding:0 0 0 16px;font-size:13px;color:var(--soft);display:flex;flex-direction:column;gap:2px}
.up-btns,.two{display:flex;gap:12px;width:100%}
.up-btns .btn,.two .btn{flex:1}
.up-btns .btn{padding:0 12px;gap:8px;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.up-fn{margin:16px 4px 0;font-size:13px;color:var(--soft)}
.up-fn a,.legal a{color:var(--g700);text-decoration:underline;text-underline-offset:2px}

/* first week carousel */
.h20{margin:0;font-weight:400;font-size:20px;line-height:1.2;color:#111112}
.fw{padding-left:0;padding-right:0}
.fw .ttl{padding-left:20px;padding-right:40px}
.fw .h20{padding:12px 24px 16px}
.fw-row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 12px;scroll-padding:0 12px;scrollbar-width:none}
.fw-row::-webkit-scrollbar{display:none}
.fw-card{flex:none;width:min(346px,calc(100% - 36px));scroll-snap-align:start;border:1px solid var(--n200);border-radius:16px;padding:8px 8px 16px;display:flex;flex-direction:column;gap:20px;background:var(--n0)}
.fw-img{position:relative;height:171px;border-radius:12px;overflow:hidden;background:var(--n200)}
.fw-img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fw-img .ov{object-position:50% 40%}
.fw-tx{padding:0 12px;display:flex;flex-direction:column;gap:8px}
.fw-tx b{font-weight:400;font-size:16px;line-height:1.2;color:var(--dark)}
.fw-tx p{margin:0;font-size:14px;color:var(--soft)}
.msg{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:min(296px,90%);display:flex;align-items:flex-end;gap:8px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.05))}
.msg img{width:25px;height:25px;border-radius:7px;object-fit:cover;flex:none;border:.5px solid var(--k10)}
.msg p{margin:0;background:var(--n100);padding:7px 14px;border-radius:10.6px 10.6px 10.6px 2.75px;font-size:13px;line-height:1.4;color:rgba(18,17,15,.8)}
.dots{display:flex;justify-content:center;gap:4px;padding:16px 0 0}
.fw-nav{display:flex;align-items:center;justify-content:center;gap:24px}
.fw-arr{display:none;width:32px;height:32px;border-radius:8px;border:.5px solid var(--g800);color:var(--g800);place-items:center;transition:background-color .2s,opacity .2s}
.fw-arr svg{width:16px;height:16px}
@media (hover:hover){.fw-arr:not(:disabled):hover{background:rgba(28,83,78,.06)}}
.fw-arr:disabled{opacity:.3;cursor:default}
@media (min-width:768px){
  /* desktop: one card at a time with arrow buttons either side of the dots */
  .fw-row{gap:40px;padding:0 20px;scroll-padding:0 20px}
  .fw-card{width:100%}
  .fw-img{height:200px}
  .fw-nav{margin-bottom:12px}
  .fw-nav{padding-top:20px}
  .fw-nav .dots{padding:0}
  .fw-arr{display:grid}
}
.dots i{width:5px;height:5px;border-radius:9px;background:var(--n300);transition:width .3s var(--ease),background-color .3s}
.dots i.on{width:12px;background:var(--g700)}

/* pharmacy + store */
.loc{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;color:var(--g700);margin:-4px 0 20px}
.loc svg{width:14px;height:14px}
.plist{display:flex;flex-direction:column;gap:4px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:16px;background:var(--n0);border:1px solid var(--n200);transition:border-color .2s,transform .2s var(--ease)}
@media (hover:hover){.prow:hover{border-color:var(--g700)}}
.prow .pl{display:flex;align-items:center;gap:12px;font-size:18px;color:var(--dark)}
.prow .num,.pk-card .num{font-size:20px;color:var(--dark)}
.plogo{width:var(--s);height:var(--s);flex:none;border-radius:50%;border:.5px solid var(--n200);background:#fff;overflow:hidden;display:grid;place-items:center}
.plogo img{width:100%;height:100%;object-fit:contain}
.plogo.ph{background:#ede8de;font-weight:500;font-size:14px;color:#1f3d33}
.st-ph{display:flex;align-items:center;gap:8px;font-size:18px;color:#201f1b;margin:-8px 0 12px}
.sec-l{margin:8px 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dark)}
.opt.st{background:var(--n0);border:1px solid var(--n200);color:var(--dark)}
.opt.st small{font-size:13px;color:var(--soft);margin:0 0 2px}
.opt.st[aria-checked="true"]{color:var(--dark)}
.more{display:block;margin:0 auto;padding:24px 0}

/* checkout */
.co .ttl{padding-bottom:16px}
.oc{position:relative;background:var(--n0);border:1px solid var(--n200);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.oc-h{display:flex;justify-content:space-between;min-height:48px}
.oc-h b{display:block;font-weight:400;font-size:18px;color:var(--dark)}
.cap.g{color:var(--g700);display:block;margin-top:6px}
.oc-h .pi{position:absolute;right:-12px;top:-14px;width:84px;height:84px;object-fit:contain}
.oc-h .pi.pen{transform:none;right:24px;top:14px;width:28px;height:76px}
.oc-h:has(.pi.pen){min-height:84px}
.oc-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--soft)}
.oc-r .num{font-size:20px;color:var(--dark)}
.oc-r.tot{color:var(--dark);border-top:1px solid var(--k10);padding-top:16px}
.co-s{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.co-sh{display:flex;justify-content:space-between;align-items:center}
.sec{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--soft)}
.cardrow{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;background:rgba(255,255,251,.4);border:1px solid var(--g700)}
.cardrow img{width:36px;height:24px}
.cardrow>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.cardrow b{font-weight:400;color:var(--dark)}
.cardrow small{font-size:13px;color:var(--soft)}
.cardrow .ic{width:20px;height:20px;border:1px solid var(--g700);border-radius:50%;display:grid;place-items:center}
.cardrow .ic::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--g700)}
.co .more{padding:8px 0}
.fn0{margin:-4px 0 0;font-size:13px;color:var(--soft)}
.co-desk{display:none}
@media (min-width:768px){.co-desk{display:block}.co-mob{display:none}}
.pay .sec-l{margin:4px 0 8px}
.fld .ccb{display:none;width:36px;height:24px}
.fld.has-cc .ccb{display:block;animation:pop .35s var(--spring) both}
.ship{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.ship .sec-l{margin:8px 0}
.ship .ddw .dd-list{max-height:240px;overflow:auto}
.pk-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--n0);border:1px solid var(--n200)}
.pk-tx{flex:1;display:flex;flex-direction:column}
.pk-tx b{font-weight:400;font-size:14px;color:var(--dark)}
.pk-tx small{font-size:13px;color:var(--soft)}
.legal{margin:24px 0 0;font-size:13px;color:var(--soft)}
.ni{text-align:center;font-size:14px;color:var(--dark);margin:24px 0 8px}
.foot.solid{background:none;padding-top:16px;gap:8px}
/* white bottom bar spans the full window width even though its content stays in the column */
.foot.solid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);z-index:-1;background:var(--n0);border-top:.5px solid #a1938c}
.due{width:100%;display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--soft)}
.due .num{font-size:20px;color:var(--dark)}
.foot:has(.due){padding-top:16px}
.sec-row{display:flex;justify-content:space-between;align-items:center}
.cap.dk2{color:var(--dark)}
.link.sm{display:inline-flex;align-items:center;gap:4px}
.link.sm svg{width:14px;height:14px}

/* confirmation */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:48px;padding-top:96px}
.done h1{font-size:28px}
.rings{width:231px;height:231px}
.rings circle:not(.c):not(.dt){animation:ring 2.4s var(--ease) both}
.rings .c{stroke-dasharray:377;stroke-dashoffset:377;animation:ckDraw .9s var(--ease) .2s forwards}
.rings .ck{stroke-dasharray:90;stroke-dashoffset:90;animation:ckDraw .6s var(--ease) .8s forwards}
.rings .dt{opacity:0;animation:ldOn .3s var(--ease) 1.3s forwards}
@keyframes ring{from{opacity:0;transform:scale(.85);transform-origin:center}to{opacity:1;transform:none}}
.ns h1{font-size:28px;padding-top:24px}
.ns .lead{margin:16px 0}
.ns-c{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:rgba(18,17,15,.2);border:.5px solid rgba(255,255,251,.1);margin-bottom:8px}
.ns-i{flex:none;width:64px;height:64px;border-radius:8px;background:var(--g700);border:.5px solid var(--g600);display:grid;place-items:center}
.ns-i img{width:24px;height:24px}
.ns-c b{display:block;font-weight:400;color:var(--rev)}
.ns-c span span{font-size:14px;color:var(--rev-soft)}

/* desktop: these screens sit in the vertical middle of the page; green screens read a size up */
@media (min-width:768px){
  html.mid .scr>.body{display:flex;flex-direction:column}
  html.mid .scr>.body::before,html.mid .scr>.body::after{content:"";flex:1 1 0}
  html.mid .ch{justify-content:flex-start}
  html.mid .rm{margin-top:40px}
  html.mid .gn-tx{padding-top:0;max-width:480px}
  .gn h1{font-size:48px}
  .gn-tx p{font-size:18px}
  .ns h1{font-size:44px;padding-top:0}
  .dk .lead{font-size:20px}
  .ns .lead{margin:20px 0 24px}
  .ns-c{gap:20px;padding:20px;margin-bottom:12px}
  .ns-i{width:72px;height:72px}
  .ns-i img{width:28px;height:28px}
  .ns-c b{font-size:20px}
  .ns-c span span{font-size:16px}
}

@media (max-width:767px){.foot{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}}

/* desktop: the CTA follows the content (40px under the last input/option) instead of sticking to the bottom of a tall window.
   Centred screens centre content + CTA together. Checkout keeps its sticky "Due now" bar. */
@media (min-width:768px){
  .scr>.body{flex:none}
  .foot:not(.solid){position:relative;bottom:auto;padding-top:16px;background:none}
  html.mid .scr{justify-content:center}
  html.mid .scr>.body::before,html.mid .scr>.body::after{display:none}
  .scr:has(.foot.solid)>.body{flex:1}
  .si-line{height:140px}
}

/* medication pill + dropdown */
.mpill{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:var(--n0);border:1px solid var(--n200);filter:drop-shadow(0 8px 6px rgba(0,0,0,.05));font-size:13px;color:var(--g700);white-space:nowrap}
.mpill .mi{width:22px;height:22px;object-fit:contain;margin:-4px 0}
.mpill .mi.pen{width:9px;height:26px;transform:rotate(-90deg);margin:-6px 9px -6px 8px}
.mpill svg{transition:transform .3s var(--ease)}
.mpill[aria-expanded="true"] svg{transform:rotate(180deg)}
.mdrop{position:absolute;left:50%;top:calc(100% - 4px);transform:translateX(-50%);z-index:30;width:min(353px,calc(100vw - 40px));background:var(--n0);border:1px solid var(--n200);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.08));animation:dropIn .35s var(--ease) both}
@keyframes dropIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translateX(-50%)}}
.md-h{position:relative;display:flex;justify-content:space-between;min-height:56px;padding-bottom:16px;border-bottom:.5px solid var(--n200)}
.md-h b{display:block;margin-top:6px;font-weight:400;font-size:20px;line-height:1.2;color:#111112}
.md-h .mi{position:absolute;right:-8px;top:-10px;width:83px;height:83px;object-fit:contain}
.md-h .mi.pen{transform:none;right:14px;top:-6px;width:40px;height:100px}
.md-rows{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:.5px solid var(--n200)}
.md-rows p{margin:0;display:flex;justify-content:space-between;font-size:14px;color:var(--soft)}
.md-rows .tot{font-size:16px;line-height:1.2;color:var(--dark);align-items:baseline}
.md-rows .tot .num{font-size:20px}
.md-n{margin:0;font-size:13px;color:var(--soft)}
.btn-sm{width:100%;height:32px;border-radius:8px;border:1px solid var(--g700);font-weight:500;font-size:12px;letter-spacing:.01em;color:var(--g700)}
@media (hover:hover){.btn-sm:hover{background:rgba(28,83,78,.06)}}

/* medication cards (picker, change sheet) */
.mcards{display:flex;flex-direction:column;gap:12px;margin:0 -8px}
.mcard{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:24px;padding:16px;border-radius:16px;background:var(--n0);border:.5px solid var(--n300);transition:border-color .2s,box-shadow .3s}
.mcard[aria-checked="true"]{border-color:var(--g700);box-shadow:0 3px 6px rgba(36,36,36,.1),-1px 12px 12px rgba(36,36,36,.09),-3px 26px 16px rgba(36,36,36,.05)}

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHECK='<svg viewBox="0 0 12 12" fill="none"><path d="M2.25 6.25L5 9.625L9.75 2.25" stroke="#FFF6BF" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 20 20" fill="none"><path d="M5.5 8l4.5 4.5L14.5 8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- medications ---------- */
const MEDS={
  wpill:{nm:'Wegovy®',full:'Wegovy® Pill',form:'Pill',chip:'Daily pill',price:149,img:'cmp-wpill',type:'pill'},
  foundayo:{nm:'Foundayo™',full:'Foundayo™',form:'Pill',chip:'Daily pill',price:149,img:'cmp-foundayo',type:'pill'},
  wpen:{nm:'Wegovy®',full:'Wegovy® Pen',form:'Pen',chip:'Weekly pen',price:199,img:'cmp-wpen',type:'pen'},
  zep:{nm:'Zepbound® KwikPen®',full:'Zepbound® KwikPen®',form:'Pen',chip:'Weekly pen',price:299,img:'cmp-zep',type:'pen'}
};

/* ---------- state ---------- */
const Q=new URLSearchParams(location.search);
const FROM=['pdp','quiz'].includes(Q.get('from'))?Q.get('from'):'home';
const S={from:FROM,med:MEDS[Q.get('med')]?Q.get('med'):(FROM==='pdp'?'wpill':null),help:false,a:{},name:'Anthony'};
const RET=Q.get('ret')||(FROM==='pdp'?'wegovy-pill.html':'index.html');

/* ---------- screens registry (filled below) ---------- */
const SCR={};
const STEPS=[['2 min','Check eligibility'],['6 min','Health history'],['3 min','ID verification'],['3 min','Review & checkout']];

/* path overview (dark) */
SCR.overview={intro:1,dark:1,logo:FROM!=='pdp',render:()=>{
  const steps=STEPS.map((s,i)=>i===0&&FROM==='quiz'?['2 min','Find your best fit and check eligibility']:s);
  const ttl=FROM==='pdp'?`Your path to ${MEDS[S.med].nm.replace(/®|™/g,'')}`:'Your path to treatment';
  return `<div class="body dk"><h1>${ttl}</h1><p class="lead">Proven treatment is closer than you think</p>
  <ol class="ov-steps">${steps.map((s,i)=>`<li><span class="numbox">${i+1}</span><span class="t"><span class="cap">${s[0]}</span><span>${s[1]}</span></span></li>`).join('')}</ol></div>
  ${foot('Let’s begin',{cls:'btn-y',alt:`<p class="alt">Already have an account?<b data-toast="Log in isn’t part of this prototype" role="button" tabindex="0">Log in</b></p>`})}`},
  mount:el=>wireNext(el)};

/* step intros (dark) */
function stepIntro(n,min,h,p,cta='Continue'){return {dark:1,fit:1,prog:[n,n===1?25:0],render:()=>`<div class="body dk"><div class="si"><span class="numbox">${n}</span><div class="tx"><span class="cap">${min}</span><h1>${h}</h1><p>${p}</p></div></div><div class="si-line" aria-hidden="true"><img src="img/intake/step-scribble.svg" alt=""></div></div>${foot(cta,{cls:'btn-y'})}`,mount:el=>wireNext(el)}}
SCR.step1=stepIntro(1,'2 min','Let’s check your eligibility','Share your goals, choose a medication, and check if you pre-qualify.');

/* eligibility questions */
SCR.goal=single('goal','What’s your weight loss goal?',['1-15 lbs','16-50 lbs','51 or more lbs','Maintain my current weight','I’m not sure yet, I just want to get started'],{prog:[1,25]});
SCR.motivation=multi('motivation','What’s inspiring you to make a change?',['I want to feel more confident','I want to have more energy','I want to improve my health','I want to be more active','I want to feel good every day'],{prog:[1,25]});
SCR.hw={prog:[1,50],render:()=>`<div class="body">${T('What’s your current height and weight?','We use this to calculate your BMI and check if you’re eligible for treatment.',1)}
  <div class="fields"><div class="frow">${fld('ft','Height',{unit:'ft',mode:'numeric'})}${fld('in','Height',{unit:'in',mode:'numeric'})}</div>${fld('lbs','Weight',{unit:'lbs',mode:'numeric'})}</div></div>${foot('Next',{dis:1})}`,
  mount:el=>{wireFields(el,['ft','in','lbs'],$('[data-next]',el));wireNext(el)}};
/* ---------- eligibility result + account ---------- */
const medShort=()=>S.med?MEDS[S.med].nm.replace(/®|™/g,'').trim():'GLP-1 treatment';
SCR.goodnews={mfit:1,mid:1,noprog:1,logo:1,blank:1,noMid:1,render:()=>{const m=MEDS[S.med]||MEDS.wpill;return `<div class="body gn">
  <div class="gn-tx"><h1>Good news!</h1><p>Based on the information you shared, you may be eligible for ${medShort()}.</p></div>
  <div class="gn-hero"><img class="pi ${m.type}" src="img/${m.img}.webp" alt=""></div>
  <div class="gn-card"><b>Proven treatment</b><p>${GOODNEWS_NOTE[S.med]||GOODNEWS_NOTE.wpill}</p></div></div>${foot('Next')}`},
  mount:el=>wireNext(el,()=>S.authed?next():authSheet('plan'))};
const GOODNEWS_NOTE={wpill:'Semaglutide, the ingredient in Wegovy, is one of the most studied weight-loss medications available.',wpen:'Semaglutide, the ingredient in Wegovy, is one of the most studied weight-loss medications available.',foundayo:'Foundayo is a once-daily pill you can take any time of day, with or without food.',zep:'Tirzepatide, the ingredient in Zepbound, helped people lose an average of 21% of their body weight in clinical trials.'};

/* email + code sheets (shared by "save your plan" and "save your best fit") */
const GOOGLE='<svg width="16" height="16" viewBox="0 0 16 16"><path fill="#4285F4" d="M15.68 8.18c0-.57-.05-1.11-.14-1.64H8v3.1h4.3a3.68 3.68 0 0 1-1.6 2.41v2h2.58c1.51-1.39 2.4-3.44 2.4-5.87z"/><path fill="#34A853" d="M8 16c2.16 0 3.97-.72 5.29-1.94l-2.58-2c-.72.48-1.63.76-2.71.76-2.08 0-3.85-1.4-4.48-3.3H.86v2.07A8 8 0 0 0 8 16z"/><path fill="#FBBC05" d="M3.52 9.52a4.8 4.8 0 0 1 0-3.04V4.41H.86a8 8 0 0 0 0 7.18l2.66-2.07z"/><path fill="#EA4335" d="M8 3.18c1.17 0 2.23.4 3.06 1.2l2.29-2.3A8 8 0 0 0 .86 4.41l2.66 2.07C4.15 4.58 5.92 3.18 8 3.18z"/></svg>';
function authSheet(kind){
  const bf=kind==='bestfit';
  openSheet(`<h2>Save your ${bf?'best fit':'plan'} to continue</h2><p class="sub">An account keeps your goals and treatment preference saved, so you can pick up where you left off.</p>
   <div class="stack">${fld('email','Email',{type:'email',mode:'email',ac:'email'})}<button type="button" class="btn btn-g" data-go disabled>Continue</button><div class="or">OR</div>
   <button type="button" class="btn btn-o" data-google>${GOOGLE}Continue with Google</button></div>
   <p class="alt">Already have an account?<b data-toast="Log in isn’t part of this prototype" role="button" tabindex="0">Log In</b></p>`,
  sh=>{const b=$('[data-go]',sh);wireFields(sh,['email'],b);
    const ok=()=>String(S.a.email||'').trim().length>0;
    $('input',sh).addEventListener('input',()=>{b.disabled=!ok()});b.disabled=!ok();
    b.addEventListener('click',()=>codeSheet(kind));$('[data-google]',sh).addEventListener('click',()=>{S.a.email=S.a.email||'anthony@example.com';codeSheet(kind)});});
}
function codeSheet(kind){
  openSheet(`<h2>Let’s confirm it’s you</h2><p class="sub">We sent a 6-digit code to ${esc(S.a.email||'your email')}. Enter it below to continue.</p>
   <div class="stack"><div class="code" role="group" aria-label="6-digit code">${'<input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit">'.repeat(6)}</div>
   <button type="button" class="btn btn-g" data-go disabled>Next</button><p class="alt" style="margin-top:0">Didn’t get a code?<b data-resend role="button" tabindex="0">Resend</b></p></div>`,
  sh=>{const ins=$$('.code input',sh),b=$('[data-go]',sh);
    const chk=()=>{b.disabled=ins.some(i=>!i.value);if(!b.disabled){clearTimeout(chk.t);chk.t=setTimeout(()=>{if(b.isConnected)b.click()},450)}};
    ins.forEach((i,n)=>{i.addEventListener('input',()=>{i.value=i.value.replace(/\D/g,'').slice(-1);if(i.value&&ins[n+1])ins[n+1].focus();chk()});
      i.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!i.value&&ins[n-1])ins[n-1].focus()});
      i.addEventListener('paste',e=>{const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!d)return;e.preventDefault();d.split('').forEach((c,k)=>{if(ins[k])ins[k].value=c});chk()})});
    $('[data-resend]',sh).addEventListener('click',()=>toast('We sent you a new code'));
    b.addEventListener('click',()=>{if(S.authed)return;S.authed=true;closeSheet();go(AFTER_AUTH())});});
}

SCR.profile={prog:[1,75],render:()=>`<div class="body">${T('Complete profile','Your healthcare team needs this info for your treatment and prescription.',1)}

SCR.checkout={prog:[4,75],render:()=>{if(S.a.szip==null&&S.a.zip)S.a.szip=S.a.zip;const m=MEDS[S.med||'wpill'],card=S.a.card,pick=S.a.ful!==1,p=PHARM[S.a.pharm??3],st=STORES[S.a.store??0];
  return `<div class="body co"><div class="ttl"><h1>Finalize your subscription</h1></div>
  <div class="oc"><div class="oc-h"><div><b>${m.full.replace('Pill','tablet')}</b><span class="cap g">28-day supply</span></div><img class="pi ${m.type}" src="img/${m.img}.webp" alt=""></div>
   <div class="oc-r"><span>Weight loss treatment (monthly)</span><span class="num">$39.00</span></div><div class="oc-r tot"><span>Due now</span><span class="num">$39.00</span></div></div>
  <section class="co-s"><div class="co-sh"><h2 class="h20">Payment</h2><span class="sec">${SHIELD}Secured and encrypted</span></div>
   <div class="co-mob">${card?`<div class="cardrow"><img src="img/intake/card-visa.svg" alt="Visa"><span><b>Visa •••• ${esc(card.last4)}</b><small>Expires ${esc(card.exp)}</small></span><span class="ic on"></span></div><button type="button" class="link more" data-card>Add a card</button>`
   :`<button type="button" class="btn btn-o" data-card><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-linecap="round"/></svg>Add payment method</button>`}</div>

  <section class="co-s"><h2 class="h20">${pick?'Pharmacy pickup':'Home delivery'}</h2><p class="fn0">You’ll pay for your medication ${pick?'at the pharmacy':'when it ships'}.</p>
   <div class="pk-card">${pick?plogo(p):`<span class="plogo ph" style="--s:40px">${TRUCK}</span>`}<span class="pk-tx"><b>${pick?p[0]:'Ships to your home'}</b><small>${pick?`${st[0]}<br>${st[1]}`:'Usually arrives in 5-7 days'}</small></span><span class="num">$${m.price}.00</span></div>
   ${pick?'':`<div class="ship"><p class="sec-l">Shipping address</p><div class="fields">${fld('street','Street address',{ac:'address-line1'})}${fld('apt','Apt, suite, etc. (optional)',{ac:'address-line2'})}<div class="frow">${fld('city','City',{ac:'address-level2'})}${fld('state','State',{sel:US_STATES})}</div>${fld('szip','Zip Code',{mode:'numeric',ac:'postal-code'})}</div></div>`}</section>
  <p class="legal">By continuing, you agree to automatic renewal at $39/mo. until canceled. Cancel 1 day before renewal by visiting the treatment plan page from your GoodRx account dashboard and selecting “Cancel” to avoid future charges. Prescription costs are separate. You also agree to the <a href="#" data-toast="Not part of this prototype">GoodRx Care Direct Terms</a> and our <a href="#" data-toast="Not part of this prototype">Agreement for Self Payment of Services</a>.</p>

  <div class="foot solid"><div class="due"><span>Due now</span><span class="num">$39.00</span></div><button type="button" class="btn btn-g" data-next disabled>Subscribe</button></div>`},
  mount:el=>{$$('[data-card]',el).forEach(b=>b.addEventListener('click',cardSheet));

    ex.addEventListener('input',()=>{const d=ex.value.replace(/\D/g,'').slice(0,4);ex.value=d.length>2?`${d.slice(0,2)} / ${d.slice(2)}`:d;S.a.pexp=ex.value});
    const cv=$('#f-pcvc',el);cv.addEventListener('input',()=>{cv.value=cv.value.replace(/\D/g,'').slice(0,4);S.a.pcvc=cv.value});
    const filled=k=>String(S.a[k]??'').trim()!=='';
    const cardOK=()=>desk.matches?(String(S.a.pcc||'').replace(/\D/g,'').length>=12&&String(S.a.pexp||'').replace(/\D/g,'').length===4&&String(S.a.pcvc||'').length>=3&&filled('pname')):!!S.a.card;

    wireFields(el,[],null);el.addEventListener('input',chk);el.addEventListener('click',()=>setTimeout(chk));desk.addEventListener('change',chk);chk();
    wireNext(el,()=>{if(desk.matches){const d=String(S.a.pcc).replace(/\D/g,'');S.a.card={last4:d.slice(-4),exp:String(S.a.pexp).replace(/\s/g,'')}}next()})}};
const US_STATES=['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];

SCR.nextSteps={mid:1,dark:1,logo:1,noClose:1,render:()=>{const pick=S.a.ful!==1;return `<div class="body dk ns"><h1>Your clinician will take it from here</h1><p class="lead">Here’s what happens next:</p>

/* ---------- choose your treatment (main + PDP) ---------- */
const GOAL_LBL=['Lose 1-15 lbs','Lose 16-50 lbs','Lose 51+ lbs','Maintain my weight','Get started'];
const MOT_LBL=[['More confidence','center'],['More energy','energy'],['Improve my health','synergy'],['Be more active','signal'],['Feel good every day','globe']];
const GOAL_IC=['chain','chain','chain','cycle','path'];
SCR.choose={mid:1,prog:[1,75],blank:1,render:()=>{
  const goals=[[GOAL_LBL[S.a.goal??0],GOAL_IC[S.a.goal??0]],...(S.a.motivation||[1,2]).map(i=>MOT_LBL[i])];
  const pdp=FROM==='pdp';
  return `<div class="body ch"><div class="gstack" aria-hidden="true"><span class="gc g3"></span><span class="gc g2"></span><span class="gc g1">${stackGoals(goals).map((g,i)=>`<span class="gf f${i}">${gface(g)}</span>`).join('')}</span></div>
  <div class="ttl" style="padding-right:0"><h1>With that in mind, now let’s ${pdp?'check your fit for '+medShort():'choose your treatment'}</h1><p class="lg">GLP-1s work with your body to help you reach your goals. ${pdp?'Continue with your preference, or get help deciding.':'Select your treatment preference, or get help deciding.'}</p></div>
  <button type="button" class="help" data-help><img src="img/intake/choose-help-pens.jpg" alt=""><span><b>Need help choosing?</b><small>Answer a few questions to find a GLP-1 that fits your routine.</small></span><svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M5.25 2.33 8.68 5.76c.68.68.68 1.8 0 2.48L5.25 11.67" stroke="#1C534E" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  ${foot(pdp?`Continue with ${medShort()}`:'Select your treatment')}`},
  // back on the choice screen: forget an earlier 'help me choose' so 'Select your treatment' goes straight to the meds
  mount:el=>{S.help=false;wireNext(el);$('[data-help]',el).addEventListener('click',()=>{S.help=true;go('prefer')});}};
function gface(g){return `<img src="img/intake/icon-${g[1]}.svg" alt=""><b>${g[0]}</b>`}
function stackGoals(g){const extra=[['More energy','energy'],['Improve my health','synergy'],['Feel good every day','globe']];const out=[...g];for(const e of extra){if(out.length>=3)break;if(!out.some(x=>x[0]===e[0]))out.push(e)}return out.slice(0,3)}
SCR.picker={prog:[1,75],blank:1,render:()=>{const sel=S.med||'wpill';return `<div class="body pk-pg"><div class="ttl"><h1>Select your treatment preference</h1><p class="lg">We’ll pass this along to your healthcare team.</p></div>
  <div class="mcards" role="radiogroup" aria-label="Treatment preference">${medCards(sel)}</div>${FOOTNOTE.replace('</div>','<p>Wegovy® HD offer applies only to 7.2mg dose and ends 12/31/26, $399 for 1 carton, $798 for 2 cartons, or $1197 for 3 cartons per month.</p></div>')}</div>
  <div class="foot solid"><p class="fnote">Your clinician will review your profile and advise you on the right medication.</p><button type="button" class="link" data-toast="The comparison tool lives on the weight loss page">Compare medications</button><button type="button" class="btn btn-g" data-next>Continue with ${MEDS[sel].nm.replace(/ ?KwikPen®/,'')}</button></div>`},
  mount:el=>{if(!S.med)S.med='wpill';const b=$('[data-next]',el);wireMedCards(el,k=>{S.med=k;b.textContent=`Continue with ${MEDS[k].nm.replace(/ ?KwikPen®/,'')}`;setHeader(SCR.picker)});wireNext(el)}};

/* ---------- best fit quiz ---------- */
SCR.bringing=multi('bring','First, what’s bringing you here?',['Feel better day to day<small>Have more energy, move more comfortably or feel better physically</small>','Support my overall health<small>Work towards goals related to blood pressure, blood sugar, joints health or general wellbeing</small>','Reach a sustainable weight<small>Make progress I can maintain over time</small>','Lose weight for an event<small>A wedding, a trip, another milestone</small>'],{prog:[1,25],max:2,sub:'Choose up to 2'});
SCR.motivationQ=multi('motq','What’s inspiring you to make a change?',['Having more energy','Moving with greater ease','Improving a health measure','Feeling more comfortable in my clothes','Seeing steady changes in my weight','Feeling in control of hunger or cravings','Not sure yet'],{prog:[1,25],none:6});
SCR.quizElig={prog:[1,50],blank:1,render:()=>`<div class="body gn"><div class="gn-tx" style="padding-top:16px"><h1>Good news!</h1><p>Based on this info, you may be eligible for GLP-1 treatment. Let’s find the best option for your goals.</p></div>
  <div class="fan" aria-hidden="true">
   <div class="fc l"><img class="bg" src="img/intake/quiz-card-wegovy-pen-bg.jpg" alt=""><img class="pen" src="img/cmp-wpen.webp" alt=""><span class="chip">Weekly pen</span><span class="fn-n"><b>Wegovy®</b><small>Injected weekly</small></span></div>
   <div class="fc r"><img class="bg" src="img/intake/quiz-card-foundayo.jpg" alt=""><span class="chip">Daily pill</span><span class="fn-n"><b>Foundayo™</b></span></div>
   <div class="fc c"><img class="bg" src="img/intake/quiz-card-wegovy-pill.jpg" alt=""><span class="chip">Daily pill</span><span class="fn-n"><b>Wegovy®</b></span></div></div></div>${foot('Next')}`,mount:el=>wireNext(el)};
SCR.prefer=single('prefer','How would you prefer to take your medication?',['Giving myself an injection once a week','Taking a pill daily, on an empty stomach<small>30 mins after waking</small>','Taking a pill daily<small>No fasting needed</small>','I’m open to any routine'],{prog:[1,50]});
SCR.injComfort=single('inj','How do you feel about giving yourself an injection?',['I’m comfortable doing it','I could do it with clear instructions','It makes me nervous'],{prog:[1,50]});
const INJ_COPY=[
  ['You’ve got this, and we’re here if you need us.','Once you get started, we’ll still walk you through your first injection. Your care team is available any time questions come up.'],
  ['We’ll walk you through it, step by step.','Once you get started, we’ll show you exactly how to inject. Your care team will also be available to support you.'],
  ['Injecting can be daunting, but we’ll make it simple.','Once you get started, we’ll show you how to inject. Your care team will also be available to support you.']];
SCR.injReassure={prog:[1,50],render:()=>`<div class="body fw ir">${T(...INJ_COPY[S.a.inj??2])}

SCR.meals=single('meals','How easy would it be to follow a routine around meals, drinks and other medications?',['Easy<small>I have a predictable morning routine</small>','Manageable with reminders<small>I’ll set reminders and make it work</small>','Difficult<small>My schedule changes often, or I have other medications to take on a schedule</small>'],{prog:[1,50]});
