SCR.consistent=multi('cons','What could make it difficult to stay consistent with treatment?',['Fasting for 30 minutes in the morning','Building a routine around treatment','Anxiety around injections','Refrigeration requirements','Travelling frequently','Not sure'],{prog:[1,75],none:5});
SCR.loadQuiz=loader('Completing your<br>lifestyle profile',['Understanding your routine','Compiling goals','Finding the best fit']);

/* recommendation from the quiz answers */
function bestFit(){const a=S.a,c=a.cons||[];let best,alt;
  if(a.prefer===0){best=c.includes(3)?'zep':'wpen';alt=best==='wpen'?'zep':'wpen'}
  else if(a.prefer===1){best=(a.meals===2||c.includes(0))?'foundayo':'wpill';alt=best==='wpill'?'foundayo':'wpill'}
  else if(a.prefer===2){best='foundayo';alt='wpill'}
  else{if(a.matters===1){best='wpen';alt='zep'}else{best='foundayo';alt='wpill'}}
  return {best,alt}}
const ROUTINE={wpill:['A daily pill, taken in the mornings',[['clock','Aligns with a consistent morning routine'],['pill','Travels easily']],'Taken after waking, 30 min before food or drink'],
  foundayo:['A daily pill, any time of day',[['clock','No fasting or timing around meals'],['pill','Travels easily']],'Taken any time, with or without food'],
  wpen:['A weekly injection',[['clock','One dose a week, on a day that suits you'],['pill','Pre-filled pen, no needles to handle']],'One dose a week, on the same day each week'],
  zep:['A weekly injection',[['clock','One dose a week, on a day that suits you'],['pill','No refrigeration needed for up to 21 days']],'One dose a week, on the same day each week']};
const BRING_CHIP=['Feel better','Overall health','Sustainable weight','Event goal'],MOTQ_CHIP=['More energy','Moving with ease','Improve my health','Comfort in my clothes','Steady changes','Control hunger','Exploring'];
SCR.align={mid:1,prog:[1,75],blank:1,render:()=>{const {best}=bestFit(),r=ROUTINE[best];const chips=[...(S.a.motq||[]).map(i=>MOTQ_CHIP[i]),...(S.a.bring||[]).map(i=>BRING_CHIP[i])].slice(0,2);
  return `<div class="body al"><div class="ttl" style="gap:16px"><h1>We’ll align your treatment with your goals &amp; routine</h1>${chips.length?`<div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`:''}<p class="lg">Sticking to treatment means getting results, that’s why aligning with your routine matters.</p></div>
  <div class="rm"><p class="rm-l">Best routine match</p><p class="rm-v">${r[0]}</p><ul class="gbox">${r[1].map(([i,t])=>`<li><img src="img/intake/bestfit-icon-${i}.svg" alt="">${t}</li>`).join('')}</ul></div></div>${foot('See my best fit')}`},mount:el=>wireNext(el)};
const WHY={wpill:'Why Wegovy fits',foundayo:'Why Foundayo fits',wpen:'Why Wegovy fits',zep:'Why Zepbound fits'};
SCR.bestfit={prog:[1,75],blank:1,herotop:1,render:()=>{const {best,alt}=bestFit(),m=MEDS[best],a=MEDS[alt],r=ROUTINE[best];
  const heard=[['clock',S.a.prefer===0?'You’re comfortable with a weekly routine':S.a.meals===2?'Your schedule changes often':'You have a consistent morning routine'],['pill',S.a.prefer===0?'You prefer a weekly injection':S.a.prefer===3?'You’re open to any routine':'You prefer a pill over an injectable'],['handshake-heart',`You’re here to ${(S.a.motq||[]).includes(1)?'improve your energy and mobility':'feel better and improve your health'}`]];
  return `<div class="body bf"><div class="bf-hero"><span class="chip">Best fit</span><h1>${m.full}</h1><p class="bf-p"><small>From</small><span class="v"><span class="num">$${m.price}</span><small>/mo</small></span></p>${medImg(best,'bf-img')}</div>
  <div class="bf-s"><p class="sec-l g">What we heard from you</p><ul class="heard">${heard.map(([i,t])=>`<li><img src="img/intake/bestfit-icon-${i}.svg" alt="">${t}</li>`).join('')}</ul>
   <div class="gbox big"><b>Your routine aligns with ${m.full}:</b><p>${TICK}${r[2]}</p></div></div>
  <div class="bf-s"><p class="also">Also a good fit:</p><div class="alt-c"><b>${a.full}</b><p class="bf-p"><small>starts at</small><span class="v"><span class="num">$${a.price}</span><small>/mo</small></span></p>${medImg(alt,'alt-img')}<button type="button" class="btn-sm" data-toast="Not part of this prototype">${WHY[alt]}</button></div></div>
  <div class="bf-s faq"><p class="sec-l mute">FAQs</p>${['How do refills and dose adjustments work?','What happens to the price as I titrate up?','Can I switch treatments later?','What if I want to cancel?'].map((q,i)=>`<div class="qa"><button type="button" aria-expanded="false"><span>${q}</span><span class="pm"></span></button><div class="ans"><div><p>${FAQ_A[i]}</p></div></div></div>`).join('')}</div></div>
  <div class="foot solid"><p class="fnote">Your clinician will review your profile and advise you on the right medication.</p><button type="button" class="link" data-explore>Explore other options</button><button type="button" class="btn btn-g" data-next>Continue with ${m.nm.replace(/ ?KwikPen®/,'')}</button></div>`},
  mount:el=>{const {best,alt}=bestFit();S.best=best;if(S.bfMed==null)S.bfMed=best;const cta=$('[data-next]',el);cta.textContent=`Continue with ${MEDS[S.bfMed].nm.replace(/ ?KwikPen®/,'')}`;
    $$('.qa button',el).forEach(b=>b.addEventListener('click',()=>{const o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);b.parentElement.classList.toggle('open',o)}));
    $('[data-explore]',el).addEventListener('click',()=>{S.med=S.bfMed;changeSheet()});
    wireNext(el,()=>{S.med=S.bfMed;if(FROM==='quiz'&&!S.authed)authSheet('bestfit');else next()})}};
const FAQ_A=['Your care team renews your prescription every month and checks in before any dose change.','Prices are shown per dose. Your clinician will walk you through any change before it happens.','Yes. Your clinician can switch you to another medication if it’s a better fit.','You can cancel any time from your account, with no fees.'];


/* ---------- medication widget (header) + change-preference sheet ---------- */
const CHEVS='<svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M5 6.5l3 3 3-3" stroke="#1C534E" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function medImg(k,cls=''){const m=MEDS[k];return `<img class="mi ${m.type} ${cls}" src="img/${m.img}.webp" alt="">`}
function medPill(){const m=MEDS[S.med];return `<button type="button" class="mpill" id="mpill" aria-expanded="false" aria-controls="mdrop">${medImg(S.med)}<span>${m.nm.replace(/®|™/g,'').split(' ')[0]}</span>${CHEVS}</button>`}
document.addEventListener('click',e=>{
  const p=e.target.closest('#mpill');const dd=$('#mdrop');
  if(p){if(dd){dd.remove();p.setAttribute('aria-expanded','false');return}openDrop(p);return}
  if(dd&&!e.target.closest('#mdrop')){dd.remove();const q=$('#mpill');q&&q.setAttribute('aria-expanded','false')}
});
function openDrop(p){const m=MEDS[S.med];p.setAttribute('aria-expanded','true');
  const d=document.createElement('div');d.className='mdrop';d.id='mdrop';
  d.innerHTML=`<div class="md-h"><div>${S.best===S.med?'<span class="chip">Best fit</span>':`<span class="chip">${m.chip}</span>`}<b>${m.full}</b></div>${medImg(S.med)}</div>
   <div class="md-rows"><p><span>Medication</span><span>$${m.price}/mo</span></p><p><span>Membership</span><span>$39/mo</span></p><p class="tot"><span>Plan total</span><span class="v"><span class="num">$${m.price+39}</span>/mo</span></p></div>
   <p class="md-n">Your physician will review your medical intake and confirm if ${medShort()} is right for you</p>
   <button type="button" class="btn-sm" data-change>Change my preference</button>`;
  $('.ih-in').appendChild(d);$('[data-change]',d).addEventListener('click',()=>{d.remove();changeSheet()});}
const SHEET_MEDS=[['wpill','Wegovy®','Daily pill'],['foundayo','Foundayo™','Daily pill'],['wpen','Wegovy® &amp; Wegovy® HD','Weekly pen'],['zep','Zepbound® KwikPen®','Weekly pen']];
function medCards(sel){return SHEET_MEDS.map(([k,n,c])=>`<button type="button" class="mcard" role="radio" aria-checked="${sel===k}" data-m="${k}"><span class="mc-t"><span class="chip">${c}</span><b>${n}</b></span><span class="mc-p"><small>from</small><span class="num">$${MEDS[k].price}</span><small>/mo*</small></span>${medImg(k,'mc-img')}<span class="ic"></span></button>`).join('')}
const FOOTNOTE=`<div class="mfn"><p>* Prices are estimates based on your preferred medication, dosage and shipping frequency. All plans are subject to healthcare professional approval and may be subject to change based on the professional's clinical judgment.</p><p>Wegovy® tablet offer applies only to 1.5 and 4mg doses, with 4mg increasing to $199 after 12/31/26 (higher doses are $299/mo.)</p><p>Foundayo™ offer applies only to 0.8mg dose, with 2.5mg increasing to $199 after 12/31/26 (higher doses are $299/mo.)</p><p>Zepbound® KwikPen® offer applies only to 10mg pen (four 2.5mg doses). 20mg pens (four 5mg doses) are $399; higher doses (30mg+ pens) are $449/month. Card expires and savings end 12/31/26.</p><p>Wegovy® pen offer applies only to first two fills at 0.25 or 0.5mg doses and ends 12/31/26—price increases to $349 after the first two fills.</p></div>`;
function wireMedCards(root,onPick){$$('.mcard',root).forEach(c=>c.addEventListener('click',()=>{$$('.mcard',root).forEach(x=>x.setAttribute('aria-checked',x===c));onPick(c.dataset.m)}))}
function changeSheet(){let pick=S.med;
  openSheet(`<h2>Change your treatment preference</h2><p class="sub">Your clinician will review your profile and advise you on the right medication.</p><div class="mcards" role="radiogroup">${medCards(pick)}</div>${FOOTNOTE}
   <div class="sh-foot"><button type="button" class="link" data-toast="The comparison tool lives on the weight loss page">Compare medications</button><button type="button" class="btn btn-g" data-go>Continue with ${MEDS[pick].nm.replace(/ ?KwikPen®/,'')}</button></div>`,
  sh=>{const b=$('[data-go]',sh);wireMedCards(sh,k=>{pick=k;b.textContent=`Continue with ${MEDS[k].nm.replace(/ ?KwikPen®/,'')}`});
    b.addEventListener('click',()=>{S.med=pick;if(cur==='bestfit')S.bfMed=pick;closeSheet();show(cur,0)})},'tall');
}


/* ---------- flow: the path depends on the entry point (FROM) and answers so far ---------- */
const POST=['profile','legal','plan','step2','results','pastMethods','bariatric','glp1Now','glp1Before','pregnancy','ethnicity','tobacco','alcohol','drugs','conditions','otherConditions','condList','surgeries','surgList','medications','medList','allergies','loadSend','step3','idIntro','idUpload','selfie','firstWeek','step4','fulfill','pharmacy','store','phone','checkout','allDone','nextSteps'];
function quizPart(){const p=S.a.prefer;
  const mid=p===0?['injComfort','injReassure']:p===1?['meals']:p==null?[]:['matters'];
  return ['prefer',...mid,'consistent','loadQuiz','align','bestfit']}
function SEQ(){
  let pre;
  if(FROM==='quiz')pre=['overview','step1','bringing','motivationQ','hw','quizElig',...quizPart()];
  else{pre=['overview','step1','goal','motivation','hw','choose'];
    if(S.help)pre.push(...quizPart(),'goodnews');else if(FROM==='pdp')pre.push('goodnews');else pre.push('picker','goodnews')}
  const post=POST.filter(k=>!(S.a.ful===1&&(k==='pharmacy'||k==='store'))&&!(LIST_SRC[k]&&S.a[LIST_SRC[k]]!==1));
  return [...pre,...post];
}
function NEXT(k){const s=SEQ(),i=s.indexOf(k);return i<0?null:s[i+1]}
function FIRST(){return 'overview'}
function AFTER_AUTH(){return 'profile'}

/* ---------- rendering ---------- */
const stage=$('#stage'),ih=$('#ih'),hMid=$('#hMid'),hBack=$('#hBack');
let hist=[],cur=null;
function setHeader(sc){
  const dark=!!sc.dark,R=document.documentElement;R.classList.toggle('dark',dark);R.classList.toggle('blank',!!sc.blank);R.classList.toggle('fit',!!sc.fit);R.classList.toggle('mfit',!!sc.mfit);R.classList.toggle('herotop',!!sc.herotop);R.classList.toggle('mid',!!sc.mid);
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=dark?'#184844':sc.blank?'#fffffb':'#f5efe5';
  ih.classList.toggle('hide',!!sc.hideHead);ih.classList.toggle('intro',!!sc.intro&&!(S.med&&!sc.logo));
  hMid.innerHTML=sc.noMid?'':(S.med&&!sc.logo&&typeof medPill==='function')?medPill():`<img class="ih-logo" src="img/intake/logo-mark.svg" alt="GoodRx">`;
  const [st,fill]=sc.prog||[0,0];ih.classList.toggle('noprog',!sc.prog||!!sc.noprog);
  $$('#prog b').forEach((b,i)=>{const n=i+1;b.style.width=(n<st?100:n===st?fill:0)+'%'});
  hBack.hidden=hist.length<1||!!sc.noBack;ih.classList.toggle('hasback',!hBack.hidden);$('#hClose').hidden=!!sc.noClose;
}
let lastDark;
function show(key,dir){
  const sc=SCR[key];if(!sc){console.warn('no screen',key);return}
  closeSheet(true);
  cur=key;setHeader(sc);
  const el=document.createElement('section');el.className='scr'+(dir?' enter':'')+(dir<0?' back':'');el.dataset.k=key;
  el.innerHTML=sc.render();
  stage.replaceChildren(el);scrollTo(0,0);
  if(sc.dark!==lastDark){lastDark=sc.dark;document.querySelectorAll('.sbar,.bbar').forEach(b=>b.replaceWith(b.cloneNode()));
    requestAnimationFrame(()=>{if(document.documentElement.scrollHeight>innerHeight+1){scrollTo(0,1);requestAnimationFrame(()=>scrollTo(0,0))}})}
  sc.mount&&sc.mount(el);
  const f=el.querySelector('h1,h2');if(f){f.tabIndex=-1;f.focus({preventScroll:true})}
}
function go(key){if(cur)hist.push(cur);history.pushState({k:key,n:hist.length},'',`#${key}`);show(key,1)}
function back(){if(!hist.length){leave();return}history.back()}
addEventListener('popstate',e=>{const k=e.state&&e.state.k;if(!k){leave();return}hist=hist.slice(0,e.state.n);
  if(SCR[k]&&SCR[k].auto&&e.state.n>0){history.back();return}/* loaders and the done screen move on by themselves; skip them going back */
  show(k,-1)});
function leave(){location.href=RET}
// a treatment is chosen by the time every path reaches 'goodnews'
const picked=()=>cur==='goodnews'||hist.includes('goodnews');
const answered=()=>Object.keys(S.a).some(k=>S.a[k]!=null&&S.a[k]!==''&&!(Array.isArray(S.a[k])&&!S.a[k].length));
function saveSheet(){
  openSheet(`<h2>Save your progress</h2><p class="sub">Enter your email to log in or create an account. We’ll save your ${picked()?'answers and treatment preference':'answers'} for later.</p>
   <div class="stack">${fld('email','Email',{type:'email',mode:'email',ac:'email'})}<button type="button" class="btn btn-g" data-go disabled>Continue</button><div class="or">OR</div>
   <button type="button" class="btn btn-o" data-google>${GOOGLE}Continue with Google</button></div>
   <button type="button" class="link sv-exit" data-exit>Exit without saving</button>`,
  sh=>{const b=$('[data-go]',sh);wireFields(sh,['email'],b);
    const ok=()=>String(S.a.email||'').trim().length>0;
    $('input',sh).addEventListener('input',()=>{b.disabled=!ok()});b.disabled=!ok();
    const saved=()=>{closeSheet();toast('Progress saved');setTimeout(leave,1100)};
    b.addEventListener('click',saved);$('[data-google]',sh).addEventListener('click',saved);
    $('[data-exit]',sh).addEventListener('click',leave)});
}
hBack.addEventListener('click',back);
$('#prog').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b)return;const n=+b.dataset.step;
  if(n>1){S.med=S.med||'wpill';S.authed=true;if(S.a.ful==null)S.a.ful=0;if(S.a.pharm==null)S.a.pharm=3;if(S.a.store==null)S.a.store=0;if(S.a.zip==null)S.a.zip='90401'}
  const k='step'+n;if(cur!==k)go(k)});
$('#hClose').addEventListener('click',()=>!S.authed&&(picked()||answered())?saveSheet():leave());
function next(){const k=NEXT(cur);if(k)go(k)}

/* ---------- toast ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-toast]');if(a){e.preventDefault();toast(a.dataset.toast||'Not part of this prototype')}});

/* ---------- bottom sheets ---------- */
const sheetRoot=$('#sheetRoot');let sheetOn=null;
function openSheet(html,mount,cls=''){
  sheetRoot.innerHTML=`<div class="sheet-bg" data-sx></div><div class="sheet-wrap"><div class="sheet ${cls}" role="dialog" aria-modal="true"><button type="button" class="sheet-x" data-sx aria-label="Close"><svg viewBox="0 0 16 16" fill="none"><path d="M3.5 3.5l9 9m0-9-9 9" stroke="currentColor" stroke-linecap="round"/></svg></button><div class="grab"></div>${html}</div></div>`;
  sheetOn=true;requestAnimationFrame(()=>requestAnimationFrame(()=>sheetRoot.classList.add('open')));
  const sh=$('.sheet',sheetRoot);mount&&mount(sh);setTimeout(()=>{const f=sh.querySelector('input,button:not(.sheet-x)');f&&f.focus({preventScroll:true})},350);
}
function closeSheet(now){if(!sheetOn)return;sheetOn=null;sheetRoot.classList.remove('open');if(now)sheetRoot.innerHTML='';else setTimeout(()=>{if(!sheetOn)sheetRoot.innerHTML=''},450)}
sheetRoot.addEventListener('click',e=>{if(e.target.closest('[data-sx]'))closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- pattern helpers ---------- */
function T(h,p,lg){return `<div class="ttl"><h1>${h}</h1>${p?`<p${lg?' class="lg"':''}>${p}</p>`:''}</div>`}
function foot(label,o={}){return `<div class="foot">${o.alt||''}<button type="button" class="btn ${o.cls||'btn-g'}" data-next${o.dis?' disabled':''}>${label}</button></div>`}
function single(id,h,opts,o={}){
  return {prog:o.prog,render:()=>`<div class="body">${T(h,o.sub,o.lg)}<div class="opts${S.a[id]!=null?' has-sel':''}" role="radiogroup" aria-label="${esc(h)}">${opts.map((x,i)=>{const on=S.a[id]===i;return `<button type="button" class="opt" role="radio" aria-checked="${on}" data-i="${i}"><span class="ol">${x}</span><span class="ic"></span></button>`}).join('')}</div></div>${foot(o.cta||'Next',{dis:S.a[id]==null})}`,
    mount:el=>{const b=$('[data-next]',el);$$('.opt',el).forEach(x=>x.addEventListener('click',()=>{$$('.opt',el).forEach(y=>y.setAttribute('aria-checked',y===x));$('.opts',el).classList.add('has-sel');S.a[id]=+x.dataset.i;b.disabled=false}));b.addEventListener('click',next)},...o.extra};
}
function multi(id,h,opts,o={}){
  return {prog:o.prog,render:()=>{const sel=S.a[id]||[];return `<div class="body multi">${T(h,o.sub||'Select all that apply.')}<div class="opts">${opts.map((x,i)=>`<button type="button" class="opt" aria-pressed="${sel.includes(i)}" data-i="${i}"${o.none===i?' data-none':''}><span class="ol">${x}</span><span class="ic">${CHECK}</span></button>`).join('')}</div></div>${foot(o.cta||'Next',{dis:!sel.length})}`},
    mount:el=>{const b=$('[data-next]',el),max=o.max||99;
      $$('.opt',el).forEach(x=>x.addEventListener('click',()=>{let sel=S.a[id]||[];const i=+x.dataset.i;
        if(sel.includes(i))sel=sel.filter(v=>v!==i);
        else{if(x.hasAttribute('data-none'))sel=[];else sel=sel.filter(v=>v!==o.none);if(sel.length>=max)sel=sel.slice(1);sel.push(i)}
        S.a[id]=sel;$$('.opt',el).forEach(y=>y.setAttribute('aria-pressed',sel.includes(+y.dataset.i)));b.disabled=!sel.length}));
      b.addEventListener('click',next)},...o.extra};
}
function fld(id,label,o={}){const v=S.a[id]??'';const on=v!=='';if(o.sel)return dd(id,label,o.sel,v);return `<div class="fld${on?' on':''}"><div class="fd"><label for="f-${id}">${label}</label>${o.sel?`<span class="sv">${esc(v)}</span><select class="ov" id="f-${id}" data-f="${id}"><option value="" disabled hidden${v?'':' selected'}></option>${o.sel.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}</select>`:`<input id="f-${id}" data-f="${id}" type="${o.type||'text'}" inputmode="${o.mode||'text'}" ${o.ac?`autocomplete="${o.ac}"`:''} value="${esc(v)}" ${o.ph?`placeholder="${o.ph}"`:''}>`}</div>${o.unit?`<span class="unit">${o.unit}</span>`:''}${o.sel?CHEV:''}</div>`}
function dd(id,label,opts,v){return `<div class="ddw" data-dd="${id}"><div class="fld dd${v?' on':''}" role="combobox" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="dl-${id}" aria-label="${esc(label)}"><div class="fd"><label>${label}</label><span class="sv">${esc(v)}</span></div>${CHEV}</div>
  <ul class="dd-list" id="dl-${id}" role="listbox">${opts.map(x=>`<li role="option" tabindex="-1" aria-selected="${x===v}">${x}</li>`).join('')}</ul></div>`}
function wireDD(root,chk){$$('.ddw',root).forEach(w=>{const f=$('.fld',w),id=w.dataset.dd,items=$$('li',w);
  const set=open=>{w.classList.toggle('open',open);f.setAttribute('aria-expanded',open);if(open){(items.find(i=>i.getAttribute('aria-selected')==='true')||items[0]).focus({preventScroll:true})}};
  f.addEventListener('click',()=>set(!w.classList.contains('open')));
  f.addEventListener('keydown',e=>{if(['Enter',' ','ArrowDown'].includes(e.key)){e.preventDefault();set(true)}});
  items.forEach((li,n)=>{li.addEventListener('click',()=>{S.a[id]=li.textContent;$('.sv',f).textContent=li.textContent;f.classList.add('on');items.forEach(x=>x.setAttribute('aria-selected',x===li));set(false);f.focus({preventScroll:true});chk&&chk()});
    li.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();(items[n+1]||li).focus()}else if(e.key==='ArrowUp'){e.preventDefault();(items[n-1]||li).focus()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();li.click()}else if(e.key==='Escape'){e.stopPropagation();set(false);f.focus()}})});
});}
document.addEventListener('click',e=>{$$('.ddw.open').forEach(w=>{if(!w.contains(e.target)){w.classList.remove('open');$('.fld',w).setAttribute('aria-expanded','false')}})});
function wireFields(el,req,btn){
  const chk=()=>{if(btn)btn.disabled=!req.every(k=>String(S.a[k]??'').trim())};
  $$('.fld:not(.dd)',el).forEach(f=>{const i=$('input',f);
    f.addEventListener('click',()=>{f.classList.add('on');i.focus()});
    i.addEventListener('focus',()=>f.classList.add('on'));
    i.addEventListener('blur',()=>{if(!i.value)f.classList.remove('on')});
    i.addEventListener('input',()=>{S.a[i.dataset.f]=i.value;chk()});
  });wireDD(el,chk);chk();
}
function wireNext(el,fn){$$('[data-next]',el).forEach(b=>b.addEventListener('click',fn||next))}

/* ---------- start ---------- */
const START=FIRST();
history.replaceState({k:START,n:0},'',`#${START}`);
show(START,1);
})();
</script>
